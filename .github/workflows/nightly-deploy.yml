name: Nightly Deploy

on:
  schedule:
    - cron: '0 1 * * *'   # 9pm ET (UTC-4 daylight / UTC-5 standard)
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test          # deploy only runs if test job succeeds
    steps:
      - name: Trigger Vercel deploy
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}
